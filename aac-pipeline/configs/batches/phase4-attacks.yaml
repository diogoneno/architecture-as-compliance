projection_rule: >-
 applied by python -m aac.attacks.phase4_budget once the measuring runs are sealed in
 runs/INDEX.json. After P4-1 (r3-a sealed), each P4-2a line is replaced by: TextFooler projected_B = n_B x
 mean_q_A(TextFooler, AVeriTeC) x 1.9 x 0.169220 s (1.9 = the pilot BERT-Attack B/A query ratio 112.6/59.2 [L]);
 DeepWordBug = n_B x (20.8 + 3) x 0.169220 s (20.8 = mean regex tokens of the subset's Refuted claims);
 PWWS and BERT-Attack = n_B x the pilot victim-B runner s/item (11.375473 and 19.050585 s). After P4-2a (its runs
 sealed), each P4-2b line = 130/113 x the measured P4-2a session seconds of the same recipe. Dispatch a batch only when
 phase4_budget prints STOP-RULE: ok (Phase 4 used + batch high <= 38.762137 and project used + batch high <= 50, with
 one session_timeout_s window per attack line added while scripts/attack_session.sh lacks the shared-deadline
 marker).
